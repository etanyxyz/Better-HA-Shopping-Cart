# HA services exposed by Better Shopping Cart (PLAN.md M9).
#
# Lists and sections are referenced by name (case-insensitive) so the
# services read naturally in automations, scripts and voice commands.

add_item:
  fields:
    name:
      example: "Whole Milk"
    list:
      example: "Weekly Shop"
    section:
      example: "Dairy"
    quantity:
      example: 2
    unit:
      example: "L"
    note:
      example: "the low-fat one"

complete_list:
  fields:
    list:
      example: "Weekly Shop"
